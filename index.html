<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوپرایزێکی تایبەت 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 35px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(238, 156, 167, 0.4);
            border: 3px solid #fff;
        }

        .cat-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 25px;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .cat-img.float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .surprise-btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse 2s infinite;
        }

        .surprise-btn:hover {
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 117, 140, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 117, 140, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 117, 140, 0); }
        }

        .hidden {
            display: none !important;
        }

        .reveal-box {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .prank-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ff4757;
            margin-top: 15px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- بەشی یەکەم: پشیلە کیوتەکە و دوگمەکە -->
        <div id="step1">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbW5lenZyZHI5OXM2eW95b3N4eG54eG54eG54eG54eG54eG54JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/MDJ9IbxxvDUQM/giphy.gif" alt="Cute Cat" class="cat-img float">
            <button class="surprise-btn" onclick="openSurprise()">تکایە سوپرایزەکەت بکەوە💞🌸</button>
        </div>

        <!-- بەشی دووەم: پشیلەی پێکەنیناوی و تێکستەکە -->
        <div id="step2" class="hidden reveal-box">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaTN4OHp2c3V0Mml5cnh2dWh6cmU2Ynh4eHh4eHh4eHh4eHh4eHhlcHx2MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/10JhviFuU2gWD6/giphy.gif" alt="Laughing Cat" class="cat-img">
            <h1 class="prank-text">گوو ناخۆی🙂؟</h1>
        </div>
    </div>

    <script>
        function openSurprise() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }
    </script>

</body>
</html>
